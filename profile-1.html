<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — KUMSKID Exam Tutor</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080c14;--surface:#0f1623;--card:#141d2e;--border:rgba(37,99,235,0.2);--blue:#2563eb;--blue2:#3b82f6;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--text:#f1f5f9;--muted:#64748b;--white:#ffffff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;}
.nav{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--surface);}
.back-btn{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;}
.nav-title{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:1px;}
.wrap{max-width:560px;margin:0 auto;padding:24px 18px 60px;}
.loading{display:flex;justify-content:center;padding:60px 0;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue2);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:18px;}
.avatar-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:8px;}
.avatar-circle{position:relative;width:96px;height:96px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:34px;overflow:hidden;margin-bottom:14px;}
.avatar-circle img{display:none;width:100%;height:100%;object-fit:cover;}
.avatar-edit-btn{position:absolute;bottom:0;right:0;background:var(--blue);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;border:3px solid var(--card);cursor:pointer;}
.profile-name{font-weight:800;font-size:20px;}
.profile-email{font-size:13px;color:var(--muted);margin-top:2px;}
.section-label{font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;font-weight:700;}
.ref-code-box{font-weight:900;color:var(--blue2);font-size:24px;letter-spacing:1px;margin-bottom:14px;}
.link-row{display:flex;gap:8px;}
.link-input{flex:1;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;outline:none;}
.btn{padding:10px 18px;border-radius:8px;border:none;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:700;font-size:13px;}
.btn-primary{background:var(--blue);color:white;}
.btn-primary:hover{background:var(--blue2);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:10px;color:white;font-weight:700;font-size:13px;z-index:999;opacity:0;transition:opacity 0.25s;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div class="nav">
  <button class="back-btn" onclick="window.location.href='index.html'">← Back</button>
  <div class="nav-title">My Profile</div>
</div>

<div class="wrap" id="profile-wrap">
  <div class="loading"><div class="spinner"></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const { createClient } = supabase;
const sb = createClient('https://olwiktyajpzvatshyysd.supabase.co','sb_publishable_odko5kSLT6dJc3RvpuPMDQ_GeVBQ_uB');
let currentUser = null;

function toast(msg, color){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = color || '#2563eb';
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 3000);
}

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'index.html'; return; }
  currentUser = session.user;
  await loadProfile();
}

async function loadProfile(){
  const { data: p } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  const name = p?.full_name || currentUser.user_metadata?.full_name || currentUser.email;
  const first = name.includes('@') ? name.split('@')[0] : name.split(' ')[0];

  const refLink = p?.referral_code ? `${window.location.origin}/index.html?ref=${p.referral_code}` : '';

  document.getElementById('profile-wrap').innerHTML = `
    <div class="card">
      <div class="avatar-wrap">
        <div class="avatar-circle" id="avatar-circle">
          <span id="avatar-letter">${first[0].toUpperCase()}</span>
          <img id="avatar-img" style="${p?.avatar_url ? 'display:block;' : 'display:none;'}" src="${p?.avatar_url || ''}">
          <label class="avatar-edit-btn">
            <input type="file" id="avatar-file-input" accept="image/*" style="display:none;" onchange="handleAvatarUpload(event)">
            📷
          </label>
        </div>
        <div class="profile-name">${name}</div>
        <div class="profile-email">${currentUser.email}</div>
      </div>
    </div>

    <div class="card">
      <div class="section-label">Your Referral Code</div>
      <div class="ref-code-box">${p?.referral_code || '---'}</div>
      <div class="section-label">Shareable Link</div>
      <div class="link-row">
        <input type="text" class="link-input" id="ref-link" readonly value="${refLink}">
        <button class="btn btn-primary" onclick="copyReferralLink()">📋 Copy</button>
      </div>
    </div>
  `;

  if(p?.avatar_url){
    document.getElementById('avatar-letter').style.display='none';
  }
}

async function handleAvatarUpload(e){
  const file = e.target.files[0];
  if(!file || !currentUser) return;
  if(file.size > 3*1024*1024){ toast('Photo too large — please choose one under 3MB', '#ef4444'); return; }
  toast('Uploading photo...', '#3b82f6');
  const fileExt = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const filePath = `avatars/${currentUser.id}.${fileExt}`;
  const { error: removeErr } = await sb.storage.from('avatars').remove([filePath]);
  if(removeErr) console.warn('Avatar remove step (non-fatal):', removeErr.message);
  const { error: uploadErr } = await sb.storage.from('avatars').upload(filePath, file, { upsert: true, contentType: file.type || 'image/jpeg' });
  if(uploadErr){ toast('Upload failed: ' + uploadErr.message, '#ef4444'); return; }
  const { data: urlData } = sb.storage.from('avatars').getPublicUrl(filePath);
  const publicUrl = urlData.publicUrl + '?t=' + Date.now();
  const { error: dbErr } = await sb.from('profiles').update({ avatar_url: publicUrl }).eq('id', currentUser.id);
  if(dbErr){ toast('Saved photo but failed to link profile: ' + dbErr.message, '#ef4444'); return; }
  document.getElementById('avatar-img').src = publicUrl;
  document.getElementById('avatar-img').style.display = 'block';
  document.getElementById('avatar-letter').style.display = 'none';
  toast('Profile photo saved ✅', '#22c55e');
}

function copyReferralLink(){
  const linkInput = document.getElementById('ref-link');
  if(!linkInput.value){ toast('Referral link not ready yet', '#ef4444'); return; }
  linkInput.select();
  navigator.clipboard.writeText(linkInput.value).then(()=>{
    toast('Referral link copied! 📋', '#22c55e');
  }).catch(()=>{
    toast('Could not copy — long-press the link box to copy manually', '#ef4444');
  });
}

init();
</script>
</body>
</html>
